services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Container-only overrides; all Qlik/LLM settings come from .env
      APP_ENV: docker
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_DSN: postgresql://qlik:qlik@postgres:5432/qlik_lineage
      NEO4J_URI: bolt://neo4j:7687
      QLIK_EXPORT_SCRIPTS_DIR: /app/exported_scripts
      # LiteLLM caches the GitHub Copilot token here; mounted to ./.copilot-auth
      GITHUB_COPILOT_TOKEN_DIR: /root/.config/litellm/github_copilot
    volumes:
      - ./.copilot-auth:/root/.config/litellm/github_copilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qlik
      POSTGRES_PASSWORD: qlik
      POSTGRES_DB: qlik_lineage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlik -d qlik_lineage"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.22
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  neo4j_data:
